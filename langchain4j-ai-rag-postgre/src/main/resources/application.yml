spring:
  application:
    name: langchain4j-ai-rag-postgre

  # 업로드 한도. 컨트롤러·서비스가 선언한 계약(파일당 5MB, 총 20MB)이 톰캣 멀티파트 파서에
  # 먼저 걸리지 않도록 맞춘다. 기본값 1MB/10MB 로는 계약상 허용인 파일이 서비스 검증에
  # 닿기도 전에 413으로 끊긴다. max-request-size 는 20MB 정각이 아니라 여유를 둔다 —
  # 서비스의 총량 검증은 파일 바이트만 세지만 실제 요청에는 멀티파트 경계·헤더가 더 실린다.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 21MB

  # PostgreSQL 데이터베이스 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # 빈 오버라이딩 허용
  main:
    allow-bean-definition-overriding: true

# 애플리케이션 설정
app:
  # ONNX 임베딩 모델 설정 파일 경로
  # 외부 JSON 파일에서 모델 및 토크나이저 파일 경로를 로드
  # Windows 예: C:/Users/{username}/langchain4j-config/embeddingConfig.json
  # Linux/Mac 예: /home/{username}/langchain4j-config/embeddingConfig.json
  embedding-config-path: ${user.home}/langchain4j-Config/Config/embeddingConfig.json

# LangChain4j Ollama 설정
langchain4j:
  ollama:
    base-url: http://localhost:11434
    chat-model:
      model-name: HyperCLOVA-3b:Q4_K_MM
      temperature: 0.4
      timeout: 60s

# PGVector 설정
pgvector:
  # 데이터베이스 연결 정보
  host: localhost
  port: 5432
  database: ragdb
  username: postgres
  password: postgres
  # 벡터 저장소 테이블 설정
  table-name: document_embeddings
  # 벡터 차원 (ko-sroberta-multitask 모델의 출력 차원)
  dimension: 768
  # 인덱스 생성 여부
  create-table: true

# 문서 처리 설정
document:
  # 문서 경로 설정
  path: file:C:/workspace-test/upload/data/**/*.md
  pdf-path: file:C:/workspace-test/upload/data/**/*.pdf
  # DOCX 파일 경로. 미설정 시 DOCX 인덱싱을 건너뜀. 예: file:C:/workspace-test/upload/data/**/*.docx
  docx-path: file:C:/workspace-test/upload/data/**/*.docx
  hwp-path: file:C:/workspace-test/upload/data/**/*.hwp
  # HWPX 문서 경로. 설정하지 않으면 건너뜀. 예: file:C:/workspace-test/upload/data/**/*.hwpx
  hwpx-path: file:C:/workspace-test/upload/data/**/*.hwpx

  # 문서 변환 설정
  # 청크 크기. 단위는 토큰이 아니라 문자다.
  # ※ 이 값은 사용하는 임베딩 모델의 토큰 상한에 종속된다. 모델을 교체하면 반드시 다시 산정할 것.
  #   상한을 넘겨도 예외나 경고가 나지 않는다. LangChain4j의 OnnxBertBiEncoder는 초과분을
  #   잘라내는 대신 상한 크기로 분할해 각각 임베딩한 뒤 토큰 수 가중평균으로 벡터 1개를 만든다.
  #   즉 내용이 사라지지는 않지만 서로 다른 주제가 한 벡터에 뭉개져 검색 정확도가 조용히 떨어진다.
  #
  #   산정 방법:
  #     1. 모델의 토큰 상한 확인 (OnnxBertBiEncoder는 510 = 512 - 특수토큰 2개로 고정)
  #     2. 대상 문서로 '문자 수 / 모델 토큰 수' 환산비 측정
  #     3. chunk-size ≒ 모델 상한 × 환산비, 여기에 안전 마진
  #
  #   현재 기본 구성(README의 ko-sroberta 계열 ONNX, 상한 510) 기준:
  #     이 저장소 한국어 문서 실측 환산비 약 1.8~2.0자/토큰 → 510 × 1.8 ≒ 918자 → 800
  chunk-size: 800

  # 한국어 문장경계 인지 청킹 설정
  chunking:
    korean-sentence:
      # 활성화 여부. false(기본)이면 기존 DocumentSplitters.recursive 방식만 사용 (기존 동작 유지)
      # 한국어가 위주인 문서에서 효과적이며, 영어 비중이 높은 문서에는 적합하지 않을 수 있음
      # 빈 줄(연속 개행) 기준 문단 경계까지 쓰려면 위 normalization.normalize-newlines 를 false 로 둔다.
      # true(기본)이면 연속 개행이 1개로 축약되어 빈 줄 경계는 동작하지 않고, 마크다운 블록·코드펜스 경계만 적용된다.
      enabled: false
      # 문장 단위 오버랩 최대 문자 수. 미설정 시 chunk-size 의 10%(최소 50)
      # overlap-size-chars: 400

  # 최대 청크 수 (문서 하나당). 한도에 걸려 버려지는 세그먼트가 생기면 WARN 로그로 알린다.
  # 그 문서는 청크가 0개가 아니라 '색인 완료'로 기록되므로, 버려진 뒷부분은 파일을 수정하기 전까지 다시 처리되지 않는다.
  # 로그가 보이면 이 값을 올리거나 문서를 나눌 것.
  max-num-chunks: 500

  # 임베딩할 최소 청크 길이
  min-chunk-length-to-embed: 50

  # 문서 정규화 설정
  normalization:
    # 정규화 기능 활성화 여부
    enabled: true
    # HTML 태그 제거 여부
    remove-html-tags: true
    # 마크다운 코드 블록 제거 여부
    remove-code-blocks: false
    # 공백 정규화 여부
    normalize-whitespace: true
    # 줄바꿈 정규화 여부
    normalize-newlines: true
    # 특수문자 정리 여부
    clean-special-chars: true

# RAG 설정
rag:
  # RAG 유사도 임계값 설정 (0.0 ~ 1.0)
  similarity:
    threshold: 0.70

  # RAG 검색 결과 개수 (Top K)
  top-k: 3

  guard:
    enabled: false        # 기본 OFF → 기존 동작 완전 보존
    policy: log           # log | block
    lexicon-path:         # (옵션) 운영자 확장 렉시콘 외부경로. 미설정 시 시드만

  # 하이브리드 검색(dense 벡터 + lexical pg_trgm, RRF 융합) 설정
  retrieval:
    hybrid:
      # 활성화 여부. false(기본)이면 dense 단일 검색만 사용 (기존 동작 유지)
      enabled: false
      # 채널 가중치
      weight:
        dense: 1.0
        lexical: 1.0
      # 융합 결과 개수. 미설정 시 rag.top-k 값을 사용
      top-k: 3
      # lexical(pg_trgm word_similarity) 임계값. `%>` 연산자가 참조하는 GUC
      # pg_trgm.word_similarity_threshold(기본 0.6)는 한국어 긴 청크에 과도하게 엄격하다.
      # 실제 문서(4000자 청크) 측정상 0.30 부근이 recall@3~0.8로 최적. 트랜잭션 스코프로만
      # 적용되어 커넥션 풀에 누수되지 않는다. recall을 더 원하면 하향(노이즈↑), 정밀도를
      # 원하면 상향한다.
      lexical:
        word-similarity-threshold: 0.30

# 채팅 메모리 설정
chat:
  memory:
    # 최대 메시지 수
    max-messages: 20

# 로깅 설정
logging:
  level:
    com.example.chat: DEBUG
    dev.langchain4j: INFO
    ai.djl: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
