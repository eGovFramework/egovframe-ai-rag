spring:
  application:
    name: spring-ai-rag-redis

  # 업로드 한도. 컨트롤러·서비스가 선언한 계약(파일당 5MB, 총 20MB)이 톰캣 멀티파트 파서에
  # 먼저 걸리지 않도록 맞춘다. 기본값 1MB/10MB 로는 계약상 허용인 파일이 서비스 검증에
  # 닿기도 전에 413으로 끊긴다. max-request-size 는 20MB 정각이 아니라 여유를 둔다 —
  # 서비스의 총량 검증은 파일 바이트만 세지만 실제 요청에는 멀티파트 경계·헤더가 더 실린다.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 21MB

  # Ollama 설정
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3-4b:Q4_K_M
        options:
          temperature: 0.4

    # 로컬 ONNX 모델 사용 설정
    model:
      embedding: transformers

    # ONNX 모델/토크나이저를 jar 외부 경로에서 로드 (OS에 무관하게 ${user.home} 기준,
    # 필요 시 EMBEDDING_MODEL_PATH/EMBEDDING_TOKENIZER_PATH 환경변수로 오버라이드)
    embedding:
      transformer:
        onnx:
          modelUri: file:${EMBEDDING_MODEL_PATH:${user.home}/spring-ai-Config/model/model.onnx}
          modelOutputName: token_embeddings
        tokenizer:
          uri: file:${EMBEDDING_TOKENIZER_PATH:${user.home}/spring-ai-Config/model/tokenizer.json}
          options:
            padding: true
            truncation: true
            maxLength: 512
            returnTensor: true

    # Redis 벡터 저장소 설정
    # 처음 실행 시에만 true로 설정하고, 이후에는 false로 변경하여 중복 데이터 방지
    vectorstore:
      redis:
        initialize-schema: true
        index-name: document-index

    # 문서 경로 설정
    document:
      path: file:C:/workspace-test/upload/data/**/*.md
      pdf-path: file:C:/workspace-test/upload/data/**/*.pdf
      docx-path: file:C:/workspace-test/upload/data/**/*.docx
      hwp-path: file:C:/workspace-test/upload/data/**/*.hwp
      hwpx-path: file:C:/workspace-test/upload/data/**/*.hwpx

      # PDF 리더 설정
      pdf:
        page-top-margin: 0
        pages-per-document: 1

      # 요약 생성 설정 여부
      enable-summary: false
      # 요약을 생성할 최소 청크 수 (기본값: 5)
      summary-min-chunks: 2

      # 키워드 추출 설정 여부
      enable-keywords: false
      keyword-count: 5

      # 청크 크기. 단위는 문자가 아니라 cl100k_base 토큰이다.
      # ※ 이 값은 사용하는 임베딩 모델에 종속된다. 모델을 교체하면 반드시 다시 산정할 것.
      #   상한을 넘는 청크는 tokenizer.options.truncation:true 때문에 예외도 로그도 없이
      #   뒷부분이 잘린 채 임베딩된다.
      #
      #   산정 방법:
      #     1. 모델의 토큰 상한 확인 — tokenizer_config.json 의 model_max_length
      #        (spring.ai.embedding.transformer.tokenizer.options.maxLength 도 이 값에 맞춘다)
      #     2. cl100k 토큰 → 모델 토큰 환산비 확인 (토크나이저가 다르므로 1:1이 아니다)
      #     3. chunk-size ≒ 모델 상한 / 환산비, 여기에 안전 마진
      #
      #   현재 기본 구성(README의 ko-sroberta 계열 ONNX, 상한 512) 기준:
      #     한국어에서 모델 토큰이 cl100k보다 약 1.25배 많아 512 / 1.25 ≒ 410 → 400
      chunk-size: 400

      # 한국어 문장경계 인지 청킹 설정
      chunking:
        korean-sentence:
          # 활성화 여부. false(기본)이면 기존 TokenTextSplitter 방식만 사용 (기존 동작 유지)
          # 한국어가 위주인 문서에서 효과적이며, 영어 비중이 높은 문서에는 적합하지 않을 수 있음
          # 빈 줄(연속 개행) 기준 문단 경계까지 쓰려면 위 normalization.normalize-newlines 를 false 로 둔다.
          # true(기본)이면 연속 개행이 1개로 축약되어 빈 줄 경계는 동작하지 않고, 마크다운 블록·코드펜스 경계만 적용된다.
          enabled: false

      # 최소 청크 크기 (문자 단위)
      min-chunk-size-chars: 350

      # 최대 청크 수
      max-num-chunks: 500

      # 임베딩할 최소 청크 길이
      min-chunk-length-to-embed: 50

      # 문서 정규화 설정
      normalization:
        # 정규화 기능 활성화 여부
        enabled: true
        # HTML 태그 제거 여부
        remove-html-tags: true
        # 마크다운 코드 블록 제거 여부
        remove-code-blocks: false
        # 공백 정규화 여부
        normalize-whitespace: true
        # 줄바꿈 정규화 여부
        normalize-newlines: true
        # 특수문자 정리 여부
        clean-special-chars: true

      # 민감정보(PII) 마스킹 설정 (색인 저장 단계 보호)
      pii-masking:
        # 마스킹 활성화 여부 (기본 비활성 — 필요 시에만 켠다)
        enabled: false
        # 주민등록번호/외국인등록번호 마스킹 여부
        mask-rrn: true
        # 카드번호 마스킹 여부 (Luhn 검사를 통과한 번호만 치환)
        mask-card: true
        # 인증키/비밀키(key=value) 값 마스킹 여부
        mask-secret: true
        # 치환 토큰
        rrn-token: "[RRN]"
        card-token: "[CARD]"
        secret-token: "[SECRET]"
        account-token: "[ACCOUNT]"
        # 계좌번호 정규식 (기관별 형식이 달라 오탐이 크므로 기본 미지정 = 비활성)
        account-regex: ""

  # Redis 연결 설정
  data:
    redis:
      host: localhost
      port: 6379

  # 빈 오버라이딩 허용 (임베딩 모델 빈 충돌 해결)
  main:
    allow-bean-definition-overriding: true

# 로깅 설정
logging:
  level:
    com.example.chat: DEBUG
    org.springframework.ai: INFO
    # DJL 관련 로그 레벨 조정 (성능 최적화 경고 숨김)
    ai.djl.pytorch.engine.PtEngine: WARN
    ai.djl: WARN

# RAG 질문 압축 설정
# 대화 히스토리를 기반으로 후속 질문을 독립적인 질문으로 압축
# true: 압축 활성화 (검색 정확도 향상, 응답 시간 증가)
# false: 압축 비활성화 (빠른 응답, 원본 질문으로 검색)
rag:
  enable-query-compression: true

  # RAG 유사도 임계값 설정 (0.0 ~ 1.0). 값이 클수록 엄격하다.
  # 주의: Redis가 메타데이터로 돌려주는 `distance`는 유사도가 아니라 (1 - cosine_similarity)다.
  similarity:
    threshold: 0.70

  # RAG 검색 결과 개수 (Top K)
  top-k: 3

  guard:
    enabled: false        # 기본 OFF → 기존 동작 완전 보존
    policy: log           # log | block
    lexicon-path:         # (옵션) 운영자 확장 렉시콘 외부경로. 미설정 시 시드만

  # 하이브리드 검색(dense 벡터 + lexical RediSearch FT.SEARCH) 설정
  # enabled:true 일 때만 lexical 채널(JedisPooled)·하이브리드 retriever 빈이 등록된다.
  # off(기본)에서는 기존 dense 단독 검색이 그대로 동작한다(빈 모호성 없음).
  retrieval:
    hybrid:
      enabled: false
      # RRF 채널 가중치(기본 1.0). lexical을 높이면 키워드 일치 문서가 상위로 올라온다.
      weight:
        dense: 1.0
        lexical: 1.0
      # 하이브리드 결과 개수. 미지정 시 rag.top-k 를 따른다.
      # top-k: 3

# 채팅 메모리 설정 (기본값: 20)
chat:
  memory:
    max-messages: 20

